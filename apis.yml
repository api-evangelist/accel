aid: accel
name: Accel
description: >-
  Accel is one of the world's leading venture capital firms, founded in 1983 by
  Arthur Patterson and Jim Swartz and headquartered in Palo Alto, California,
  with additional offices in San Francisco, London, and Bangalore, India. Accel
  describes itself as "the first partner to exceptional teams everywhere,"
  backing founders from seed and early stage through growth worldwide. The firm
  invests across enterprise software and SaaS, consumer, artificial
  intelligence, fintech, cybersecurity, infrastructure and developer tools,
  security, media, and healthcare, and operates dedicated funds for the US,
  Europe/Israel, and India/Southeast Asia. Accel is known for its "prepared
  mind" investment philosophy and for backing category-defining companies
  including Facebook, Slack, Dropbox, Atlassian, CrowdStrike, UiPath, Qualtrics,
  Spotify, Flipkart, Swiggy, Freshworks, 1Password, Vercel, Scale AI, Anthropic,
  and Perplexity. Its portfolio spans more than 100 unicorns, dozens of IPOs,
  and hundreds of acquisitions. In 2024 Accel raised a $650M fund for European
  and Israeli startups, and in 2025 raised a fund for India and Southeast Asia.
  This profile tracks Accel's identity and its portfolio graph across the API
  Evangelist network.
